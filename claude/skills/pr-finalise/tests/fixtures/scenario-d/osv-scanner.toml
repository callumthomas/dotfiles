reason = "CSRF in react-router unstable RSC APIs only; this app is a client-only SPA (BrowserRouter/Routes, no SSR, no RSC APIs used). Fix requires react-router 8.x, which mandates React >=19.2.7. Will revisit with React 19 upgrade."
