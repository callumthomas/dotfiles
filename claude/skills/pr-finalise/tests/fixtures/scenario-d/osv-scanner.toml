[[IgnoredVulns]]
id = "GHSA-jrc7-96c5-q579"
reason = "maplibre-gl XSS is in the map attribution control's DOM.sanitize(); maplibre-gl is pulled in transitively via @ant-design/charts -> @ant-design/maps -> @antv/l7-maps and no map component is used in this app (only Line/Column/Pie/DualAxes are imported from @ant-design/charts), so the vulnerable code is never rendered and is not in the production bundle at all. No upstream fix path: the latest @antv/l7-maps (2.29.1) still pins maplibre-gl ^3.5.2 and @ant-design/charts 2.x drops maps entirely. Revisit with the @ant-design/charts 2 upgrade."
ignoreUntil = 2027-03-31

