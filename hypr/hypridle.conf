general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/hyprlock-themed.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10-minute heartbeat re-lock: even if hyprlock crashes or is dismissed without
# unlocking, this listener will re-issue loginctl lock-session via dbus, which
# triggers lock_cmd above.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
