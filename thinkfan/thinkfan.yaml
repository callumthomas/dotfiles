sensors:
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1, 3, 5, 6, 7]
  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: amdgpu
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1]

fans:
  - tpacpi: /proc/acpi/ibm/fan

# Levels skip 4 and 6 deliberately — those steps are too aggressive on this chassis;
# the gap between 3 and 5 (and 5 and 7) smooths the ramp.
levels:
  - ["level 0",          0, 55]
  - ["level 1",         48, 60]
  - ["level 2",         53, 65]
  - ["level 3",         58, 70]
  - ["level 5",         63, 78]
  - ["level 7",         70, 85]
  - ["level full-speed", 78, 32767]
