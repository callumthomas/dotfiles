set -g prefix C-a
unbind C-b


bind | split-window -h
unbind '"'

bind - split-window -v
unbind %

bind r source-file ~/.tmux.conf

set -g mouse on

setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1

set-option -g renumber-windows on

bind C-j resize-pane -D 5
bind C-k resize-pane -U 5
