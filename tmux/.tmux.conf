set -g prefix C-a
unbind C-b


bind | split-window -h
unbind '"'

bind - split-window -v
unbind %

bind r source-file ~/.tmux.conf

set -g mouse on

set -g set-titles on
set -g set-titles-string "#{pane_title}"

setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1

set-option -g renumber-windows on

bind C-j resize-pane -D 5
bind C-k resize-pane -U 5

set -g pane-border-indicators arrows

# Active pane: black background, inactive: slightly grey
set -g window-style 'bg=#1a1a1a'
set -g window-active-style 'bg=#000000'

# Status bar turns blue when the active pane is zoomed (default green otherwise)
set -g status-style 'bg=#{?window_zoomed_flag,#5f87d7,green},fg=black'

set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g window-status-bell-style 'bg=red,fg=white,blink,bold'

set -g focus-events on
set-hook -g client-focus-in 'set -uw window-status-style ; set -uw window-status-current-style'
set-hook -g session-window-changed 'set -uw window-status-style ; set -uw window-status-current-style'
